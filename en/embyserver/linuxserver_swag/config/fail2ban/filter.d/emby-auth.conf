# Rejected Emby authentication requests in SWAG's nginx combined access log.
# https://dev.emby.media/reference/RestAPI/UserService/postUsersAuthenticatebyname.html
# https://dev.emby.media/doc/restapi/index.html
# https://nginx.org/en/docs/http/ngx_http_log_module.html

[Definition]
# Only nginx's leading remote_addr field supplies the address to ban.
# Fail2Ban removes the timestamp before matching, leaving empty brackets.
failregex = ^<ADDR> - [^"\r\n]* \[[^\]\r\n]*\] "POST /(?i:(?:emby/)?users/authenticatebyname)(?:\?[^"\s]*)? HTTP/[0-9.]+" (?:401|403) [0-9]+(?: |$)

ignoreregex =
